mutation UpsertDeliveryRoute($data: DeliveryRoute_Data!) @auth(level: USER) {
  deliveryRoute_upsert(data: $data)
}

mutation DeleteDeliveryRoute($id: UUID!) @auth(level: USER) {
  deliveryRoute_delete(id: $id)
}

mutation UpdateDeliveryRoute($id: UUID!, $data: DeliveryRoute_Data!) @auth(level: USER) {
  deliveryRoute_update(id: $id, data: $data)
}

query GetDeliveryRoute($id: UUID!) @auth(level: USER) {
  deliveryRoute(id: $id) {
    id
    distanceKm
    estimatedArrival
    safetyStatus
  }
}

query ListDeliveryRoutes @auth(level: USER) {
  deliveryRoutes {
    id
    vehicleType
    distanceKm
  }
}

